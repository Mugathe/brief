# Makes a picture and a reel for each new top story and publishes them, with no browser needed.
# Uses the same two secrets as the news-saving job (Settings -> Secrets and variables -> Actions):
#   SITE_URL    e.g. https://your-site.example     (no trailing slash)
#   INGEST_KEY  the same INGEST_KEY you set on the server
# It does nothing until you switch it on in the admin under Studio -> Automatic service.
# GitHub may start scheduled jobs a few minutes late; "Run workflow" starts one at once.
name: Studio reels
on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:
concurrency:
  group: studio-reels
  cancel-in-progress: false
jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: scripts/studio/package-lock.json
      - name: Install the renderer
        working-directory: scripts/studio
        run: npm ci --no-audit --no-fund
      - name: Make and publish what is new
        working-directory: scripts/studio
        env:
          SITE_URL: ${{ secrets.SITE_URL }}
          INGEST_KEY: ${{ secrets.INGEST_KEY }}
        run: node run.mjs
